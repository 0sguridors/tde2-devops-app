<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Calculadora — TDE2</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; padding: 40px; background: #f5f5f5; }
    .calc { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 260px; }
    h2 { margin: 0 0 20px; font-size: 18px; color: #333; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
    button { width: 48%; padding: 10px; margin: 2px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; background: #4f46e5; color: white; }
    #result { margin-top: 16px; font-size: 16px; color: #333; }
  </style>
</head>
<body>
  <div class="calc">
    <h2>Calculadora</h2>
    <input type="number" id="a" placeholder="Número A" />
    <input type="number" id="b" placeholder="Número B" />
    <button onclick="calcular('soma')">Somar</button>
    <button onclick="calcular('sub')">Subtrair</button>
    <button onclick="calcular('mult')">Multiplicar</button>
    <button onclick="calcular('div')">Dividir</button>
    <div id="result"></div>
  </div>
  <script src="calc.js"></script>
</body>
</html>
