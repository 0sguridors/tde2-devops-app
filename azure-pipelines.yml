trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

- stage: CI
  displayName: 'Build e Testes'
  jobs:

  - job: Testes
    displayName: 'Testes unitários'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Instalar Node.js'

    - script: npm install
      displayName: 'Instalar dependências'

    - script: npm test -- --coverage
      displayName: 'Executar testes com cobertura'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/junit.xml'
      condition: always()
      displayName: 'Publicar resultados dos testes'

  - job: SonarCloud
    displayName: 'Análise estática SonarCloud'
    dependsOn: Testes
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Instalar Node.js'

    - script: npm install
      displayName: 'Instalar dependências'

    - task: SonarCloudPrepare@3
      inputs:
        SonarCloud: 'sonarcloud-connection'
        organization: '0sguridors'
        scannerMode: 'CLI'
        configMode: 'file'
      displayName: 'Preparar SonarCloud'

    - script: npm test -- --coverage
      displayName: 'Rodar testes para cobertura'

    - task: SonarCloudAnalyze@3
      displayName: 'Executar análise SonarCloud'

    - task: SonarCloudPublish@3
      inputs:
        pollingTimeoutSec: '300'
      displayName: 'Publicar resultado SonarCloud'

- stage: Docker
  displayName: 'Build e Push Docker Hub'
  dependsOn: CI
  condition: succeeded()
  jobs:

  - job: DockerBuildPush
    displayName: 'Gerar e publicar imagem Docker'
    steps:
    - task: Docker@2
      displayName: 'Build e Push para Docker Hub'
      inputs:
        containerRegistry: 'dockerhub-connection'
        repository: 'rafaelschuck/tde2-devops-app'
        command: 'buildAndPush'
        Dockerfile: 'Dockerfile'
        tags: |
          $(Build.BuildId)
          latest